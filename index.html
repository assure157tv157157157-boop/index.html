<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Obfuscator</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0a0a0a;
    color: white;
}

header {
    background: linear-gradient(90deg, #8b0000, #ff0000);
    padding: 20px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.editor {
    width: 100%;
    height: 300px;
    background: #111;
    color: white;
    border: 2px solid red;
    border-radius: 10px;
    padding: 15px;
    font-size: 14px;
    resize: none;
}

.buttons {
    margin-top: 15px;
    display: flex;
    gap: 10px;
}

button {
    background: red;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: darkred;
}

.output {
    margin-top: 20px;
}

footer {
    text-align: center;
    padding: 15px;
    margin-top: 40px;
    color: gray;
}
</style>

</head>
<body>

<header>
Nova Script Obfuscator
</header>

<div class="container">

<h2>Coloque seu Script</h2>

<textarea id="code" class="editor" placeholder="Cole seu script aqui..."></textarea>

<div class="buttons">
    
    <input type="file" id="fileInput" hidden>

    <button onclick="openFile()">Abrir Arquivo</button>
    <button onclick="obfuscate()">Ofuscar</button>
    <button onclick="copyCode()">Copiar</button>

</div>

<div class="output">
<h3>Resultado</h3>
<textarea id="result" class="editor" placeholder="Script ofuscado aparecerá aqui..."></textarea>
</div>

</div>

<footer>
Nova Obfuscator © 2026
</footer>

<script>

function openFile() {
    document.getElementById("fileInput").click();
}

document.getElementById("fileInput").addEventListener("change", function(event) {

    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {
        document.getElementById("code").value = e.target.result;
    };

    reader.readAsText(file);
});

async function obfuscate() {

    const code = document.getElementById("code").value;

    if (!code) {
        alert("Coloque um script primeiro");
        return;
    }

    document.getElementById("result").value = "Ofuscando...";

    try {

        const response = await fetch("https://nova-obf.netlify.app/.netlify/functions/obf", {

            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "x-api-key": "nova_f6fe7qtco9wzdj8cd2usxq"
            },

            body: JSON.stringify({
                code: code,
                level: "premium"
            })

        });

        const data = await response.json();

        if (data.success) {
            document.getElementById("result").value = data.code;
        } else {
            document.getElementById("result").value = "Erro ao ofuscar";
        }

    } catch (error) {
        document.getElementById("result").value = "Erro de conexão";
    }
}

function copyCode() {

    const result = document.getElementById("result");

    result.select();
    document.execCommand("copy");

    alert("Script copiado!");

}

</script>

</body>
</html>
