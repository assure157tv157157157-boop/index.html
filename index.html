<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Obfuscator | Panel</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #9d4edd;
            --primary-hover: #7b2cbf;
            --bg: #0a0a0a;
            --card: rgba(20,20,20,0.8);
            --border: rgba(255,255,255,0.1);
            --text: #fff;
            --text-dim: #aaa;
        }

        * {
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter',sans-serif;
        }

        body {
            background: radial-gradient(circle,#1a0b2e,#0a0a0a);
            color:var(--text);
            display:flex;
            flex-direction:column;
            align-items:center;
        }

        header {
            text-align:center;
            padding:2rem;
        }

        .logo {
            font-size:2.5rem;
            font-weight:800;
            background:linear-gradient(to right,#fff,var(--primary));
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }

        .container {
            width:95%;
            max-width:1000px;
            display:grid;
            grid-template-columns:1fr 300px;
            gap:2rem;
        }

        @media(max-width:850px){
            .container{grid-template-columns:1fr;}
        }

        .glass {
            background:var(--card);
            border:1px solid var(--border);
            border-radius:20px;
            padding:1.5rem;
            backdrop-filter:blur(10px);
        }

        textarea {
            width:100%;
            height:400px;
            background:#0006;
            border:1px solid var(--border);
            border-radius:10px;
            color:#ccc;
            padding:1rem;
            resize:none;
        }

        button {
            cursor:pointer;
            border:none;
            border-radius:10px;
            padding:0.8rem;
        }

        .level-btn {
            width:100%;
            background:#fff1;
            margin-bottom:5px;
            color:#fff;
        }

        .level-btn.active {
            background:var(--primary);
        }

        .obf-btn {
            width:100%;
            background:var(--primary);
            color:#fff;
            font-weight:700;
            margin-top:10px;
        }

        .obf-btn:hover {
            background:var(--primary-hover);
        }

        .toast {
            position:fixed;
            bottom:20px;
            right:20px;
            background:#2ecc71;
            padding:10px 20px;
            border-radius:10px;
            display:none;
        }
    </style>
</head>

<body>

<header>
    <h1 class="logo">Nova Obf</h1>
    <p style="color:var(--text-dim)">Proteção de scripts Lua</p>
</header>

<div class="container">

    <div class="glass">
        <h3>Source Code</h3>
        <textarea id="codeInput" placeholder="-- Cole seu script aqui"></textarea>

        <div style="display:flex;gap:10px;margin-top:10px;">
            <button onclick="copyCode()" class="level-btn">Copy</button>
            <button onclick="clearCode()" class="level-btn">Clear</button>
        </div>
    </div>

    <div class="glass">
        <h4>Level</h4>

        <button class="level-btn active" onclick="setLevel('weak',this)">Weak</button>
        <button class="level-btn" onclick="setLevel('medium',this)">Medium</button>
        <button class="level-btn" onclick="setLevel('strong',this)">Strong</button>
        <button class="level-btn" onclick="setLevel('harder',this)">Harder</button>
        <button class="level-btn" onclick="setLevel('premium',this)">Premium</button>
        <button class="level-btn" onclick="setLevel('ultra',this)">Ultra</button>

        <button id="obfBtn" onclick="obfuscate()" class="obf-btn">
            Ofuscar
        </button>
    </div>

</div>

<div id="toast" class="toast">Copiado!</div>

<script>
    let currentLevel = "weak";

    const apiKey = "nova_f6fe7qtco9wzdj8cd2usxq"; // ✅ SUA API
    const apiUrl = "https://nova-obf.netlify.app/.netlify/functions/obf";

    function setLevel(level, el){
        currentLevel = level;
        document.querySelectorAll(".level-btn").forEach(b=>b.classList.remove("active"));
        el.classList.add("active");
    }

    async function obfuscate(){
        const input = document.getElementById("codeInput");
        const btn = document.getElementById("obfBtn");

        if(!input.value.trim()){
            alert("Coloque um script primeiro");
            return;
        }

        btn.disabled = true;
        btn.innerText = "Ofuscando...";

        try{
            const res = await fetch(apiUrl,{
                method:"POST",
                headers:{
                    "Content-Type":"application/json",
                    "x-api-key":apiKey
                },
                body:JSON.stringify({
                    code: input.value,
                    level: currentLevel
                })
            });

            const data = await res.json();

            if(data.success){
                input.value = data.code;
                showToast("Ofuscado!");
            }else{
                alert("Erro: " + (data.error || "Falha"));
            }

        }catch(e){
            alert("Erro conexão: " + e.message);
        }

        btn.disabled = false;
        btn.innerText = "Ofuscar";
    }

    function copyCode(){
        const text = document.getElementById("codeInput").value;
        navigator.clipboard.writeText(text);
        showToast("Copiado!");
    }

    function clearCode(){
        document.getElementById("codeInput").value = "";
    }

    function showToast(msg){
        const t = document.getElementById("toast");
        t.innerText = msg;
        t.style.display = "block";
        setTimeout(()=>t.style.display="none",2000);
    }
</script>

</body>
</html>
